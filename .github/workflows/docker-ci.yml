name: demo docker ci build  run push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t flask-app-demo:${{ github.sha }} .

      - name: save Docker image
        run: |
          docker save flask-app-demo:${{ github.sha }} -o flask-app-demo.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with: 
           name: flask-docker-app
           path: flask-app-demo.tar   
          
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Downloads Image or Artifact
        uses: actions/download-artifact@v4

      - name: Load docker image
        run: |
          docker load -i ./flask-docker-app/flask-app-demo.tar

      - name: Run the container
        run: |
          docker run -d -p 5000:5000 --name flask-app-demo flask-app-demo:${{ github.sha }} 
        
      - name: Wait for the application to run
        run: |
          sleep 10    

      - name: check the web app
        run: | 
          curl http://localhost:5000
       
      - name: Checking logs
        if: always()
        run: |  
          docker logs flask-app-demo
  
  push:
    name: Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: flask-docker-app
      - name: Load Docker image
        run: |
          docker load -i flask-app-demo.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag image
        run: |
          docker tag \
            flask-app-demo:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/flask-app-demo:${{ github.sha }}

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/flask-app-demo:${{ github.sha }}        

  deploy:
    name: Deploy App to Ec2
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Deploy app to Ec2
        uses: appleboy/ssh-action@v@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST}}
          username: ${{ secrets.EC2_USER}}
          key: ${{ secrets.EC2_SSH_KEY}}

          script: |
            echo "Loggin into Docekr hub"
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            echo "Pulling Docker Image"
            docker pull ${{ secrets.DOCKER_USERNAME }}/flask-app-demo:${{ github.sha }}

            echo " Stopping the running container"
            docker stop flask-app-demo || true

            echo "Removing the running container"
            docker rm flask-app-demo || true

            echo "Running New container"
            docker run -d -p 80:5000 --name flask-app-demo ${{ secrets.DOCKER_USERNAME }}/flask-app-demo:${{ github.sha }}

            echo "Application Deployed Successfully"
            docker ps