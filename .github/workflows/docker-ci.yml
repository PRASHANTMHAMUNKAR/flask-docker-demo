name: Docker Ci

on:
  push: 
    branches:
      - main

jobs: 
  docker-build:
    runs-on: ubuntu-latest  
    
    steps: 

      - name: checkout code
        uses: actions/checkout@v4

      - name: build-dokcer image
        run: |
          docker build -t flas- demo .

      - name: show docker image
        run: |
          docker images         
